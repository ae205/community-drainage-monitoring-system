<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register — Drainage Watch</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar" id="navbar"></div>
<div class="container" style="max-width:440px;">
  <div class="card">
    <h1>Create an Account</h1>
    <p class="subtitle">Register to report drainage issues in your community.</p>
    <form id="registerForm">
      <label>Full Name</label>
      <input type="text" id="full_name" required>
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="080...">
      <label>Password</label>
      <input type="password" id="password" required minlength="6">
      <button type="submit" style="width:100%;">Register</button>
      <div class="error-box" id="err"></div>
    </form>
    <p style="font-size:13px; margin-top:16px; text-align:center;">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>
<script src="idb.js"></script>
<script src="app.js"></script>
<script>
renderNav('register');
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError('err');
  try {
    const data = await api('/api/auth/register', {
      method: 'POST', noAuth: true,
      json: {
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
      }
    });
    setAuth(data.token, data.user);
    window.location.href = 'resident_dashboard.html';
  } catch (err) {
    showError('err', err.message);
  }
});
</script>
</body>
</html>
