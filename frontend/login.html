<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log In — Drainage Watch</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar" id="navbar"></div>
<div class="container" style="max-width:440px;">
  <div class="card">
    <h1>Log In</h1>
    <p class="subtitle">Residents and environmental officers use the same login.</p>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Password</label>
      <input type="password" id="password" required>
      <button type="submit" style="width:100%;">Log In</button>
      <div class="error-box" id="err"></div>
    </form>
    <p style="font-size:13px; margin-top:16px; text-align:center;">No account yet? <a href="register.html">Register</a></p>
    <p style="font-size:12px; margin-top:10px; text-align:center; color:#9ca3af;">Demo admin: admin@drainage.local / admin123</p>
  </div>
</div>
<script src="idb.js"></script>
<script src="app.js"></script>
<script>
renderNav('login');
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError('err');
  try {
    const data = await api('/api/auth/login', {
      method: 'POST', noAuth: true,
      json: {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }
    });
    setAuth(data.token, data.user);
    window.location.href = data.user.role === 'admin' ? 'admin_dashboard.html' : 'resident_dashboard.html';
  } catch (err) {
    showError('err', err.message);
  }
});
</script>
</body>
</html>
